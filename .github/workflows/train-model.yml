name: Train Placement360 model

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/train-model.yml"
      - "requirements.txt"
      - "data/download_data.py"
      - "src/**"
      - "app.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: placement360-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      MPLBACKEND: "Agg"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download public placement dataset
        run: python data/download_data.py
      - name: Train Random Forest and evaluate on official test split
        run: python src/train_model.py
      - name: Verify generated evaluation reports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required = [
              "reports/placement_metrics.json",
              "reports/feature_importance.csv",
              "reports/test_predictions.csv",
              "reports/confusion_matrix.png",
              "reports/roc_curve.png",
              "reports/feature_importance.png",
          ]
          missing = [p for p in required if not Path(p).exists()]
          if missing:
              raise SystemExit(f"Missing expected outputs: {missing}")
          metrics = json.loads(Path(required[0]).read_text())
          print({k: metrics.get(k) for k in ("rows", "train_rows", "test_rows", "split_method", "accuracy", "precision", "recall", "f1", "roc_auc")})
          PY
      - name: Upload trained model and reports
        uses: actions/upload-artifact@v4
        with:
          name: placement360-trained-model-and-reports
          path: |
            models/
            reports/
          if-no-files-found: error
          retention-days: 30
      - name: Commit evaluation reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/*.json reports/*.csv reports/*.png
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Add generated Placement360 evaluation reports"
            git push
          fi
